# .orchestration/config.yaml
#
# Per-repo orchestration config. Copy this to `<repo>/.orchestration/config.yaml`
# and edit it for your project. The plugin's scripts, agents, and commands read
# this file so one harness works across codebases without a fork.
#
# Division of responsibility:
#   - THIS FILE declares the *mechanics*: branch model, gate commands, CI check
#     names, what triggers a security review, concurrency. Repo-specific facts.
#   - Your repo's CLAUDE.md / AGENTS.md hold the *knowledge*: conventions,
#     gotchas, the actual rules. The gate agents read those (see `rules_docs`).
#     Keep engineering rules out of this file; keep wiring out of those docs.
#
# "read by" annotations on each block:
#   shell  -> parsed by scripts/lib-config.sh (pure bash, no YAML dependency)
#   agent  -> read semantically by the orchestrator / gate agents from the YAML
#   both   -> read by shell for enforcement, and by agents for narration
#
# The legacy shell parser supports two shapes only: flat `key: value` scalars, and
# simple block lists / list-of-maps under a top-level key (see self_check).
# Do not introduce deeper nesting under a shell-read key.

# --- Schema version ------------------------------------------------------- both
# schema_version: 1 is the legacy ticket pipeline. Existing repositories keep
# their current behavior and do NOT adopt release-candidate states until they
# explicitly migrate to schema_version: 2.
schema_version: 1

# --- LLM execution routing ---------------------------------------------- agent
# Existing repositories remain on desktop execution unless they opt into API.
# Provider/model/effort are used only by API routes. A role inherits every
# unspecified global field and may override any field independently.
#
# `fallback: desktop` is deliberately narrow: use it only when an API request
# failed before receiving any provider/run id. A submitted, accepted, or
# uncertain request keeps its API reservation and must be reconciled; launching
# a desktop fallback then could duplicate writes, PRs, or billing.
llm:
  execution: desktop             # desktop | api
  provider: anthropic            # anthropic | openai | azure_adm
  model: ""                      # required when effective execution is api
  effort: ""                     # optional: low | medium | high | xhigh | max
  fallback: none                 # desktop | none; applies only to API launch
  # Hard ceilings are checked before every provider request. The runner reserves
  # the request's counted input plus its full output allowance, so concurrent
  # workers cannot race past a shared ticket or sprint limit.
  budgets:
    max_usd_per_run: 1.00
    max_usd_per_ticket: 2.00
    max_usd_per_sprint: 20.00
    max_output_tokens_per_turn: 4096
    max_tool_rounds: 8
    max_tool_output_chars: 12000
    tool_timeout_seconds: 300
    max_pre_ack_retries: 2       # only explicit rate-limit/overload rejections
    retry_backoff_seconds: 1
  # Rates are USD per million tokens and are deliberately explicit: an unknown
  # model fails closed instead of being costed with a guessed price. Verify rates
  # when upgrading the plugin/model. These entries were checked 2026-08-26.
  pricing:
    claude-sonnet-5:
      input_per_mtok: 2.00
      cache_write_per_mtok: 2.50
      cache_read_per_mtok: 0.20
      output_per_mtok: 10.00
    gpt-5.6-sol:
      input_per_mtok: 4.00
      cache_write_per_mtok: 5.00
      cache_read_per_mtok: 0.40
      output_per_mtok: 20.00
      long_context_threshold_tokens: 272000
      long_context_input_multiplier: 2.00
      long_context_output_multiplier: 1.50
  roles:
    # implementer:
    #   execution: api
    #   provider: anthropic
    #   model: claude-sonnet-5
    #   effort: high
    #   fallback: desktop
    #   allowed_tools: [read_file, search, git_diff, git_status, run_check, apply_patch]
    # code-reviewer:
    #   execution: api
    #   provider: openai
    #   model: gpt-5.6-sol
    #   effort: medium
    #   allowed_tools: [read_file, search, git_diff, git_status, run_check]
    # sprint-worker:
    #   execution: api
    #   provider: azure_adm
    #   model: grok-4-6-eval     # Azure deployment name, not catalog model name
    #   allowed_tools: [read_file, search, git_diff, git_status, run_check, apply_patch]
    # security-reviewer:
    #   execution: desktop
    # visual-qa:
    #   execution: desktop        # API runner is text/code only; keep visual QA native

# --- Branch model --------------------------------------------------------- both
integration_branch: ""          # fill for schema v1, e.g. the branch feature work targets
production_branch: ""           # fill for schema v1, e.g. the protected release/history target

# --- Merge strategy per target -------------------------------------------- both
merge_to_integration: merge     # merge | squash. `merge` preserves per-PR history
merge_to_production: squash     # squash -> one clean commit per release

# --- CI required checks --------------------------------------------------- both
# Exact GitHub check-run names. Defines what "CI green" means on each target.
# The gate polls these before allowing merge-on-green.
ci_checks_integration:
  - TypeScript
  - Vitest
  - Build
ci_checks_production:
  - TypeScript
  - Vitest
  - Build
  - Playwright

# --- Self-check gate ------------------------------------------------------ both
# Runs in the implementer's worktree before it pushes, and again by the gate.
# Each entry is a named shell command; the gate reports pass/fail per name, so
# name them well. This is where a repo declares its own conventions (a hex-color
# grep, a lint rule, a codegen-drift check) WITHOUT the framework hardcoding them.
# A check passes on exit 0. Negate a "must find nothing" grep with `! grep ...`.
#
# `run` values are passed verbatim to `bash -c` (the parser strips only a pair of
# matching outer quotes; it does no YAML escape processing). Quote a value when it
# starts with `!` or contains a space-then-`#`. Prefer SINGLE quotes when the value
# needs literal backslashes: YAML single-quotes pass them through unchanged.
# Do not put an inline `# comment` after a `run:` value.
#
# Watch the exit codes: `! grep PATTERN path` reports success both when the
# pattern is absent AND when `path` is missing (grep exits 2), so a mistyped
# path silently passes. Point the check at a path you know exists.
self_check:
  - name: typecheck
    run: npx tsc --noEmit
  - name: build
    run: npm run build
  - name: unit
    run: npm test
  # Example repo-specific convention (delete if not applicable):
  # - name: no-hex-in-components
  #   run: '! grep -rqn "#[0-9a-fA-F]\{3,\}" src/components'

# Successful command output is discarded. On failure, gates emit only this many
# trailing lines into model context and retain the full 0600 log under
# .orchestration/.gate-logs for an explicit diagnostic check.
gate_log_lines: 80

# --- Heavy / optional verification --------------------------------------- agent
# Named headless pass/fail suites (e.g. the full e2e run). Opt-in: they assume a
# browser suite / running app. run-verification.sh <name> runs one and writes a
# sha-stamped result file the merge-guard validates. Each runs only on the target
# named in `when`.
#   when: never | integration | production | always
# Omit or leave empty for repos with no heavy suite.
verification:
  - name: e2e
    run: npx playwright test
    when: production          # release-gate only, by default
#
# Visual QA is a separate OPTIONAL agent stage (orchestration-visual-qa), not a
# verification entry -- it needs vision, not a pass/fail command. It runs
# run-visual-qa.sh, which reads BASE_URL and, for authed surfaces, AUTH=1 with
# VQA_EMAIL / VQA_PASSWORD and (if the login form differs) LOGIN_PATH and
# EMAIL_SELECTOR / PASSWORD_SELECTOR / SUBMIT_SELECTOR. Configure those via the
# environment when you invoke the stage; there is nothing to declare here.

# --- Gate sequence -------------------------------------------------------- agent
# Which independent review roles run, in order, before merge-on-green.
# Drop security-review for repos with no auth / data-isolation / payment surface.
gates:
  - code-review
  - security-review

# --- Review loop bounds -------------------------------------------------- agent
# A review loop with no termination condition runs until something external stops
# it. These two keys bound it.
#
# `max_review_rounds` is how many FIX CYCLES one PR may spend -- rounds that sent
# it back for changes -- before the loop STOPS and hands the PR to a human. A
# passing gate costs nothing, so a PR running both the code and security gates is
# not penalized for it. Hitting the cap is not a merge: blocking findings still
# block. It ends the loop instead of letting it run indefinitely.
# Round 1 sweeps the whole diff with full blocking authority; from round 2 the
# scope freezes, and only open ledger components, regressions in the delta, and
# security findings can block. That is what makes the blocking set shrink.
#
# Raise it for large or exploratory changes; 2 makes a strict, fast-failing loop.
# A ticket that repeatedly hits the cap is usually underspecified, not badly
# implemented -- scope it harder rather than raising this.
max_review_rounds: 3
review_ledger_dir: .orchestration/.review-ledger

# --- Security-gate trigger ------------------------------------------------ agent
# When the security gate is mandatory. Either the literal `always`, or a list of
# path fragments / keywords matched against the PR diff. Any match -> required.
security_required_when:
  - migrations/
  - rls
  - auth
  - policy
  - SECURITY DEFINER
  - webhook
  - payment

# --- Ticket system -------------------------------------------------------- agent
# How the orchestrator resolves and transitions work items.
ticket:
  kind: none                  # jira | github | none
  project: ""                 # optional tracker project/key; unused when kind=none
  # Jira adapters MUST pass this list as the API's `fields` parameter, then run
  # the response through scripts/context_pipeline.py sanitize-jira before any
  # ticket text enters model context. Omit jira_fields to use the same defaults.
  jira_fields:
    - key
    - summary
    - description
    - status
    - priority
    - components
    - subtasks
    - issuelinks

# --- Sprint orchestration ------------------------------------------------- agent
# Used by orchestrate-sprint when ticket.kind is jira. `active` is resolved to an
# exact Jira sprint id before checkpointing. For each dependency link type,
# blocked_side identifies the Jira API side occupied by the blocked ticket; the
# issue on the opposite side is its prerequisite. Adjust for your Jira scheme.
sprint_id: active
sprint_dependency_links:
  - type: Blocks
    blocked_side: inward       # inward | outward; Jira default "is blocked by"
sprint_ready_statuses:
  - Ready
  - To Do
  - Open
  - Selected for Development
sprint_done_statuses:
  - Done
  - Closed
  - Resolved
sprint_blocked_statuses:
  - Blocked
sprint_checkpoint_dir: .orchestration/.sprint-state

# --- Concurrency ---------------------------------------------------------- both
# Max concurrent per-ticket sprint workflows and heavy verification chains. Drop
# to 1 under CI contention or when agents would collide on a shared test branch.
concurrency_max: 2

# --- Worktrees ------------------------------------------------------------ both
worktree_base: .claude/worktrees   # where isolated agent worktrees are created
# Cleanup is opt-in because hooks and lifecycle behavior vary by host. `manual`
# preserves every worktree until a human/agent explicitly removes it; `auto`
# allows the orchestrator and trusted Stop hook to remove clean, unlocked agent
# worktrees. Dirty or locked worktrees are always preserved.
worktree_cleanup: manual            # manual | auto

# --- Canonical rules docs ------------------------------------------------- agent
# The docs every gate agent must read before judging a diff. This is the seam
# that keeps project knowledge out of the harness.
rules_docs:
  - CLAUDE.md
  - AGENTS.md

